name: build-test-package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    env:
      TEXTALONIA_FUZZ_STEPS: '120'
      TEXTALONIA_FAILURE_DIR: ${{ github.workspace }}/artifacts/fixture-failures
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Textalonia.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build Textalonia.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/Textalonia.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Pack
        run: dotnet pack src/Textalonia -c Release --no-build -o artifacts/packages
      - name: Restore independent package consumer
        run: dotnet restore tests/Textalonia.PackageSmoke --configfile tests/Textalonia.PackageSmoke/NuGet.Config --packages artifacts/consumer-cache --force
      - name: Run independent package consumer
        run: dotnet run --project tests/Textalonia.PackageSmoke -c Release --no-restore
      - name: Export native qualification fixtures
        run: dotnet run --project benchmarks/Textalonia.Benchmarks -c Release --no-build -- --export-fixtures artifacts/native/fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: |
            artifacts/packages/
            artifacts/*.png
            artifacts/test-results/
            artifacts/fixture-failures/
            artifacts/native/
            artifacts/benchmarks/
            tests/**/TestResults/*.trx
            docs/baselines/native/
