name: build-test-package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Textalonia.sln --configfile NuGet.Config
      - name: Build
        run: dotnet build Textalonia.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/Textalonia.Tests -c Release --no-build --logger trx
      - name: Pack
        run: dotnet pack src/Textalonia -c Release --no-build -o artifacts/packages
      - name: Restore independent package consumer
        run: dotnet restore tests/Textalonia.PackageSmoke --configfile tests/Textalonia.PackageSmoke/NuGet.Config
      - name: Run independent package consumer
        run: dotnet run --project tests/Textalonia.PackageSmoke -c Release --no-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          path: |
            artifacts/
            tests/**/TestResults/*.trx
